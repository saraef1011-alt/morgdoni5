<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرغ‌دونی آنلاین</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f5efe2;color:#29251f}main{max-width:900px;margin:auto;padding:24px}h1{text-align:center}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.row{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #bbb}button{cursor:pointer;background:#fff}.primary{background:#222;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.cardbtn{min-height:90px;font-weight:bold}.status{padding:10px;border-radius:10px;background:#eee}.hidden{display:none}#log{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:13px}
</style>
</head>
<body><main>
<h1>🐔 مرغ‌دونی</h1>
<div class="card"><div id="status" class="status">در حال اتصال...</div></div>
<div class="card" id="lobby">
<h2>ورود به بازی</h2><div class="row"><input id="name" placeholder="نام شما"><button class="primary" onclick="quickGame()">بازی سریع</button><button onclick="createRoom()">ساخت اتاق خصوصی</button></div>
<div class="row" style="margin-top:10px"><input id="room" placeholder="کد اتاق"><button onclick="joinRoom()">ورود به اتاق</button></div>
<div id="roomInfo"></div></div>
<div class="card hidden" id="game"><h2 id="turn">بازی</h2><div id="players"></div><div class="cards" id="cards"></div><button onclick="drawCard()">🃏 کشیدن کارت</button><button onclick="endTurn()">پایان نوبت</button></div>
<div class="card"><h3>گزارش</h3><div id="log"></div></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=typeof io==='function'?io():null;let state=null;
const $=id=>document.getElementById(id);function log(x){$('log').textContent+=x+'\n';$('log').scrollTop=$('log').scrollHeight}
if(!socket){$('status').textContent='خطا: Socket.IO در دسترس نیست';}else{socket.on('connect',()=>{$('status').textContent='🟢 متصل به سرور';log('اتصال برقرار شد')});socket.on('disconnect',()=>$('status').textContent='🔴 اتصال قطع شد');socket.on('error',e=>log('خطا: '+(e?.message||e)));socket.on('roomState',s=>{state=s;render()});socket.on('gameState',s=>{state=s;render()});socket.on('message',m=>log(typeof m==='string'?m:JSON.stringify(m)));}
function name(){return $('name').value.trim()||'بازیکن'}
function quickGame(){socket?.emit('quickGame',{name:name()})}
function createRoom(){socket?.emit('createPrivateGameRoom',{name:name()})}
function joinRoom(){socket?.emit('joinGameRoom',{name:name(),roomCode:$('room').value.trim()})}
function drawCard(){socket?.emit('gameAction',{action:'draw'})}function endTurn(){socket?.emit('gameAction',{action:'endTurn'})}
function render(){if(!state)return;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('players').textContent=(state.players||[]).map(p=>p.name).join(' | ');$('turn').textContent=state.currentPlayer?'نوبت: '+state.currentPlayer:'بازی مرغ‌دونی';let hand=state.hand||state.myHand||[];$('cards').innerHTML=hand.map((c,i)=>`<button class="cardbtn" onclick="play(${i})">${label(c)}</button>`).join('')}
function label(c){return ({chicken:'🐔 مرغ',rooster:'🐓 خروس',nest:'🪺 لانه',fox:'🦊 روباه',trap:'🪤 تله',snake:'🐍 مار'})[c]||c}
function play(i){socket?.emit('gameAction',{action:'playCard',index:i})}
</script></body></html>
