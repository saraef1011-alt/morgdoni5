<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرغ‌دونی آنلاین</title><style>body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#f5efe2;color:#29251f}main{max-width:900px;margin:auto;padding:24px}h1{text-align:center}.box{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.row{display:flex;gap:10px;flex-wrap:wrap}button,input{font:inherit;padding:11px 14px;border-radius:10px;border:1px solid #bbb}button{cursor:pointer}.primary{background:#222;color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.cardbtn{min-height:90px;font-weight:bold}.status{padding:10px;border-radius:10px;background:#eee}.hidden{display:none}#log{white-space:pre-wrap;max-height:220px;overflow:auto;font-size:13px}.code{font-size:22px;font-weight:bold}</style></head><body><main><h1>🐔 مرغ‌دونی</h1><div class="box"><div id="status" class="status">آماده برای ورود</div></div><div class="box" id="lobby"><h2>ورود به بازی</h2><div class="row"><input id="name" placeholder="نام شما"><button class="primary" onclick="createRoom()">ساخت اتاق</button></div><div class="row"><input id="room" placeholder="کد اتاق"><button onclick="joinRoom()">ورود به اتاق</button></div><div id="roomInfo"></div></div><div class="box hidden" id="game"><h2 id="turn">بازی</h2><div id="players"></div><div class="cards" id="cards"></div><div class="row"><button onclick="drawCard()">🃏 کشیدن کارت</button><button onclick="endTurn()">پایان نوبت</button></div></div><div class="box"><h3>گزارش</h3><div id="log"></div></div></main><script>let socket=null,state=null,roomCode='';const $=id=>document.getElementById(id);function log(x){$('log').textContent+=x+'\n'}function status(x){$('status').textContent=x}function connect(){if(socket)return;status('در حال اتصال...');socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+encodeURIComponent(roomCode));socket.onopen=()=>status('🟢 متصل به Cloudflare');socket.onclose=()=>{status('🔴 اتصال قطع شد');socket=null};socket.onerror=()=>log('خطای اتصال');socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state'){state=m.state;render()}else if(m.type==='room'){roomCode=m.code;$('roomInfo').innerHTML='<div>کد اتاق: <span class="code">'+m.code+'</span></div>'}else if(m.type==='message')log(m.text);else if(m.type==='error')log('⚠️ '+m.text)}catch{}}}function send(m){connect();const f=()=>socket.readyState===1&&socket.send(JSON.stringify(m));socket.readyState===1?f():socket.addEventListener('open',f,{once:true})}function n(){return $('name').value.trim()||'بازیکن'}function makeCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}function createRoom(){roomCode=makeCode();send({type:'create',name:n(),roomCode})}function joinRoom(){roomCode=$('room').value.trim().toUpperCase();if(!roomCode)return log('کد اتاق را وارد کن');send({type:'join',name:n(),roomCode})}function drawCard(){send({type:'action',action:'draw'})}function endTurn(){send({type:'action',action:'endTurn'})}function play(i){send({type:'action',action:'playCard',index:i})}function render(){if(!state)return;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('players').textContent='بازیکنان: '+(state.players||[]).map(p=>p.name).join(' و ');$('turn').textContent=state.started?'نوبت: '+state.currentPlayer:'منتظر بازیکن دوم...';$('cards').innerHTML=(state.hand||[]).map((c,i)=>'<button class="cardbtn" onclick="play('+i+')">'+label(c)+'</button>').join('')}function label(c){return({chicken:'🐔 مرغ',rooster:'🐓 خروس',nest:'🪺 لانه',fox:'🦊 روباه',trap:'🪤 تله',snake:'🐍 مار'})[c]||c}</script></body></html>
