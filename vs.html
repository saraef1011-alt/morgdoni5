<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرغ‌دونی | VS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;overflow:hidden;background:radial-gradient(circle at 50% 35%,#6b3b1f,#28150c 52%,#0d0704);color:#fff}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}.wood{position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(8deg,transparent 0 22px,#d58b42 23px 25px,transparent 26px 49px)}.vs{position:relative;width:min(1250px,94vw);max-height:94vh;text-align:center}.title{font-size:clamp(28px,5vw,62px);font-weight:1000;text-shadow:0 5px 0 #4b210d,0 10px 25px #000;margin-bottom:25px}.players{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,42px);flex-wrap:wrap;max-height:65vh;overflow:auto;padding:5px}.player{width:min(240px,27vw);min-width:150px;padding:16px 12px;border:4px solid #e5a43c;border-radius:28px;background:linear-gradient(145deg,#fff3d2,#c87929);color:#3a1908;box-shadow:0 18px 45px #0009;animation:pop .65s ease both}.avatar{width:clamp(95px,11vw,145px);height:clamp(95px,11vw,145px);margin:auto;border-radius:50%;display:grid;place-items:center;font-size:clamp(50px,7vw,78px);background:#f9d27a;border:6px solid #fff0ba}.name{font-size:clamp(18px,2.4vw,29px);font-weight:1000;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;margin-top:7px;padding:5px 12px;border-radius:20px;background:#6e3214;color:#ffe8b0;font-weight:900;font-size:13px}.vsmark{font-size:clamp(55px,10vw,120px);font-weight:1000;font-style:italic;color:#ffd23d;text-shadow:0 7px 0 #8c2b12,0 12px 28px #000;transform:rotate(-6deg);animation:pulse 1.1s infinite alternate}.sub{margin-top:22px;font-size:clamp(16px,2vw,22px);color:#ffe4b0;font-weight:800}.start{margin-top:18px;border:0;border-radius:18px;padding:13px 35px;font-size:19px;font-weight:900;cursor:pointer;background:#27ae60;color:#fff;box-shadow:0 6px 0 #126331}.mute{position:fixed;top:18px;left:18px;border:2px solid #f4c66b;border-radius:50%;width:50px;height:50px;background:#432310;color:#fff;font-size:21px;cursor:pointer;z-index:3}@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:none}}@keyframes pulse{to{transform:rotate(-6deg) scale(1.08)}}@media(max-width:650px){.players{gap:8px}.player{width:42vw;min-width:135px;padding:10px 7px}.sub{font-size:14px}}</style></head><body><audio id="vsMusic" src="/audio/vs.mp3" preload="auto" loop></audio><div class="screen"><div class="wood"></div><main class="vs"><div class="title">⚔️ آماده‌ی نبرد؟</div><div class="players" id="players"></div><div class="sub">نبرد مرغ‌دونی تا چند لحظه‌ی دیگر شروع می‌شود... <b id="count">5</b></div><button class="start" onclick="returnToGame()">🎮 ورود به بازی</button></main><button class="mute" id="mute" onclick="toggleMusic()">🔊</button></div><script>
const q=new URLSearchParams(location.search),music=document.getElementById('vsMusic'),box=document.getElementById('players');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c))}
let ps=[];try{ps=JSON.parse(q.get('players')||'[]')}catch{}if(!Array.isArray(ps)||!ps.length)ps=[{name:q.get('p1')||'بازیکن ۱',avatar:'🐔'},{name:q.get('p2')||'بازیکن ۲',avatar:'🐓'}];
ps.forEach((p,i)=>{const c=document.createElement('section');c.className='player';c.innerHTML=`<div class="avatar">${esc(p.avatar||'🐔')}</div><div class="name">${esc(p.name||'بازیکن')}</div><div class="badge">${i===0?'بازیکن اول':'بازیکن'}</div>`;box.appendChild(c);if(i===0&&ps.length===2){const v=document.createElement('div');v.className='vsmark';v.textContent='VS';box.appendChild(v)}});
function playMusic(){music.play().catch(()=>{})}document.addEventListener('click',playMusic,{once:true});function toggleMusic(){if(music.paused){music.play().catch(()=>{});document.getElementById('mute').textContent='🔊'}else{music.pause();document.getElementById('mute').textContent='🔇'}}
let n=5;const ce=document.getElementById('count');const iv=setInterval(()=>{n--;ce.textContent=Math.max(0,n);if(n<=0)clearInterval(iv)},1000);
function returnToGame(){const room=q.get('room')||sessionStorage.getItem('morgdoniRoom');if(room)location.replace('/?room='+encodeURIComponent(room));else history.length>1?history.back():location.replace('/')}setTimeout(returnToGame,5200);
</script></body></html>
